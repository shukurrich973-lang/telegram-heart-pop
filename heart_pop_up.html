<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17050d" />
  <title>Yurakcha Pop</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js?61"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg-1: #13040b;
      --bg-2: #3b071d;
      --pink: #ff3f85;
      --pink-light: #ff98bd;
      --white: #fff7fb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 50% 72%, rgba(255, 70, 132, .28), transparent 34%),
        radial-gradient(circle at 18% 14%, rgba(255, 125, 171, .14), transparent 26%),
        linear-gradient(160deg, var(--bg-2), var(--bg-1) 70%);
      color: var(--white);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .glow {
      position: absolute;
      width: min(72vw, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 73, 139, .24), rgba(255, 73, 139, 0) 68%);
      filter: blur(5px);
      animation: breathe 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .heart-button {
      position: relative;
      width: 148px;
      height: 148px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04)),
        rgba(255, 65, 133, .12);
      box-shadow:
        0 24px 70px rgba(255, 32, 111, .32),
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -14px 28px rgba(62,0,25,.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      outline: none;
      transition: transform .12s ease, filter .12s ease;
    }

    .heart-button::before,
    .heart-button::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .heart-button::before {
      inset: 10px;
      border: 1px solid rgba(255,255,255,.16);
    }

    .heart-button::after {
      width: 24px;
      height: 11px;
      top: 24px;
      left: 35px;
      transform: rotate(-28deg);
      background: rgba(255,255,255,.3);
      filter: blur(1px);
    }

    .heart-button:active,
    .heart-button.is-popping {
      transform: scale(.88);
      filter: brightness(1.14);
    }

    .heart-core {
      font-size: 78px;
      line-height: 1;
      transform-origin: center;
      filter: drop-shadow(0 12px 18px rgba(141, 0, 51, .42));
      animation: heartbeat 1.55s ease-in-out infinite;
    }

    .heart-button.is-popping .heart-core {
      animation: pop .42s cubic-bezier(.2,.9,.3,1.3);
    }

    .hint {
      margin: 0;
      font-size: 15px;
      letter-spacing: .01em;
      color: rgba(255,255,255,.78);
      text-align: center;
    }

    .sound-toggle {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      color: white;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      font-size: 19px;
      cursor: pointer;
    }

    #particles {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }

    .particle-heart,
    .particle-bubble,
    .spark {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
      pointer-events: none;
    }

    .particle-heart {
      font-size: var(--size);
      filter: drop-shadow(0 8px 9px rgba(117,0,43,.32));
      animation: fly-heart var(--duration) cubic-bezier(.18,.72,.23,1) forwards;
    }

    .particle-bubble {
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      border: 1.5px solid rgba(255, 220, 235, .76);
      background:
        radial-gradient(circle at 30% 27%, rgba(255,255,255,.88) 0 5%, transparent 7%),
        radial-gradient(circle at 65% 70%, rgba(255,104,160,.2), transparent 52%),
        rgba(255,255,255,.06);
      box-shadow: inset 0 0 10px rgba(255,255,255,.12);
      animation: fly-bubble var(--duration) ease-out forwards;
    }

    .spark {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: spark .58s ease-out forwards;
    }

    @keyframes fly-heart {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.3) rotate(0deg);
      }
      12% { opacity: 1; }
      55% { opacity: .98; }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--drift)), calc(-50% - var(--rise)))
          scale(var(--scale))
          rotate(var(--rotate));
      }
    }

    @keyframes fly-bubble {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.15); }
      12% { opacity: .9; }
      76% { opacity: .58; }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--drift)), calc(-50% - var(--rise)))
          scale(1.25);
      }
    }

    @keyframes spark {
      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.1);
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.08); }
      24% { transform: scale(.98); }
      36% { transform: scale(1.05); }
      50% { transform: scale(1); }
    }

    @keyframes pop {
      0% { transform: scale(.72); }
      50% { transform: scale(1.28) rotate(-5deg); }
      100% { transform: scale(1); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .72; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-core, .glow { animation: none; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="glow"></div>
    <button class="sound-toggle" id="soundToggle" aria-label="Ovozni o‘chirish">🔊</button>

    <section class="stage">
      <button class="heart-button" id="heartButton" aria-label="Yurakchalarni uchirish">
        <span class="heart-core">💗</span>
      </button>
      <p class="hint">Yurak ustiga bosing</p>
    </section>

    <div id="particles" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const tg = window.Telegram?.WebApp;
      const app = document.getElementById("app");
      const button = document.getElementById("heartButton");
      const particles = document.getElementById("particles");
      const soundToggle = document.getElementById("soundToggle");

      let audioContext = null;
      let soundEnabled = true;
      let animationLock = false;

      if (tg) {
        tg.ready();
        tg.expand();
        try { tg.disableVerticalSwipes?.(); } catch (_) {}

        const theme = tg.themeParams || {};
        if (theme.bg_color) document.body.style.backgroundColor = theme.bg_color;
      }

      const random = (min, max) => Math.random() * (max - min) + min;
      const px = value => `${Math.round(value)}px`;
      const ms = value => `${Math.round(value)}ms`;

      function getAudioContext() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          audioContext = new AudioCtx();
        }
        if (audioContext.state === "suspended") audioContext.resume();
        return audioContext;
      }

      // Tashqi MP3 talab qilmaydigan, Web Audio orqali yaratiladigan yumshoq “pufak” ovozi.
      function playBubbleSound() {
        if (!soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;

        for (let i = 0; i < 3; i += 1) {
          const start = now + i * 0.055;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();

          osc.type = i === 1 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(380 + i * 95, start);
          osc.frequency.exponentialRampToValueAtTime(780 + i * 130, start + 0.11);
          osc.frequency.exponentialRampToValueAtTime(245 + i * 35, start + 0.23);

          filter.type = "lowpass";
          filter.frequency.setValueAtTime(1800, start);
          filter.Q.value = 1.2;

          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.07 - i * 0.012, start + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.25);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.27);
        }
      }

      function createHeart(x, y, index) {
        const heart = document.createElement("span");
        const symbols = ["💗", "💕", "💖", "💓", "💞", "❤️"];
        heart.className = "particle-heart";
        heart.textContent = symbols[index % symbols.length];
        heart.style.setProperty("--x", px(x + random(-22, 22)));
        heart.style.setProperty("--y", px(y + random(-12, 18)));
        heart.style.setProperty("--size", px(random(22, 48)));
        heart.style.setProperty("--duration", ms(random(1250, 2050)));
        heart.style.setProperty("--drift", px(random(-150, 150)));
        heart.style.setProperty("--rise", px(random(310, 610)));
        heart.style.setProperty("--scale", random(.75, 1.45).toFixed(2));
        heart.style.setProperty("--rotate", `${random(-38, 38).toFixed(1)}deg`);
        particles.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove(), { once: true });
      }

      function createBubble(x, y) {
        const bubble = document.createElement("span");
        bubble.className = "particle-bubble";
        bubble.style.setProperty("--x", px(x + random(-42, 42)));
        bubble.style.setProperty("--y", px(y + random(-18, 28)));
        bubble.style.setProperty("--size", px(random(10, 34)));
        bubble.style.setProperty("--duration", ms(random(1000, 1850)));
        bubble.style.setProperty("--drift", px(random(-115, 115)));
        bubble.style.setProperty("--rise", px(random(260, 520)));
        particles.appendChild(bubble);
        bubble.addEventListener("animationend", () => bubble.remove(), { once: true });
      }

      function createSpark(x, y, index, count) {
        const spark = document.createElement("span");
        const angle = (Math.PI * 2 * index) / count + random(-.15, .15);
        const distance = random(55, 105);
        spark.className = "spark";
        spark.style.setProperty("--x", px(x));
        spark.style.setProperty("--y", px(y));
        spark.style.setProperty("--dx", px(Math.cos(angle) * distance));
        spark.style.setProperty("--dy", px(Math.sin(angle) * distance));
        particles.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }

      function pop(event) {
        event?.preventDefault?.();

        const rect = button.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        playBubbleSound();

        try {
          tg?.HapticFeedback?.impactOccurred("soft");
        } catch (_) {
          navigator.vibrate?.(18);
        }

        button.classList.remove("is-popping");
        void button.offsetWidth;
        button.classList.add("is-popping");

        for (let i = 0; i < 18; i += 1) {
          window.setTimeout(() => createHeart(x, y, i), i * 18);
        }

        for (let i = 0; i < 13; i += 1) {
          window.setTimeout(() => createBubble(x, y), i * 16);
        }

        for (let i = 0; i < 14; i += 1) createSpark(x, y, i, 14);

        window.setTimeout(() => button.classList.remove("is-popping"), 450);
      }

      button.addEventListener("pointerdown", pop, { passive: false });

      soundToggle.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
        soundToggle.setAttribute("aria-label", soundEnabled ? "Ovozni o‘chirish" : "Ovozni yoqish");
        try { tg?.HapticFeedback?.selectionChanged(); } catch (_) {}
      });

      // Mini App tashqarisida oddiy brauzerda ham ishlaydi.
      app.addEventListener("contextmenu", event => event.preventDefault());
    })();
  </script>
</body>
</html>
